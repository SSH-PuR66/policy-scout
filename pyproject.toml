[project]
name = "policy-scout"
version = "0.4.0"
description = "GAMECHANGER-inspired semantic search over DoD policy documents"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "pypdf>=3.17",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
policy_scout = ["static/*.html"]
