name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test (includes retrieval-quality eval gates)
        run: pytest -v

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e . bandit pip-audit cyclonedx-bom
      - name: SAST (bandit)
        run: bandit -r src -ll
      - name: Dependency vulnerabilities (pip-audit)
        run: pip-audit || true  # report-only until baseline triaged
      - name: SBOM (CycloneDX)
        run: cyclonedx-py environment -o sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t policy-scout:ci .
      - name: Smoke test
        run: |
          docker run -d --rm -p 8000:8000 --name scout policy-scout:ci
          sleep 5
          curl -sf localhost:8000/health
          docker stop scout
